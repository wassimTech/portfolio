<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#040302"/>
    </linearGradient>

    <!-- Orange Flame Signature Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="75%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#44403c" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Ambient Central Warm Glow -->
  <rect x="60" y="60" width="392" height="392" rx="72" fill="url(#ambientGlow)"/>

  <!-- Left Code Bracket < -->
  <path d="M 94 192 L 46 256 L 94 320"
        fill="none"
        stroke="url(#orangeGrad)"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Monogram Letter W -->
  <path d="M 124 192 L 159 320 L 194 230 L 229 320 L 264 192"
        fill="none"
        stroke="#ffffff"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Monogram Letter A -->
  <path d="M 284 320 L 332 192 L 380 320"
        fill="none"
        stroke="#ffffff"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- Crossbar of A in Orange Signature -->
  <path d="M 302 276 L 362 276"
        fill="none"
        stroke="url(#orangeGrad)"
        stroke-width="30"
        stroke-linecap="round"/>

  <!-- Slash / -->
  <path d="M 408 186 L 390 326"
        fill="none"
        stroke="url(#orangeGrad)"
        stroke-width="32"
        stroke-linecap="round"/>

  <!-- Right Code Bracket > -->
  <path d="M 420 192 L 466 256 L 420 320"
        fill="none"
        stroke="url(#orangeGrad)"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>